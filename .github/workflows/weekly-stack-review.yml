name: Update weekly Stack Review

on:
  workflow_dispatch:
  schedule:
    # Two UTC candidates cover Prague's CET/CEST change; the next step admits exactly 10:00 local.
    - cron: "0 8,9 * * 0"

permissions:
  contents: write

concurrency:
  group: tech-brief-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Prague schedule
        id: schedule
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Prague"))
          print(f"run={'true' if now.weekday() == 6 and now.hour == 10 else 'false'}")
          PY
      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
      - name: Build Stack Review data
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/update.py --weekly
      - name: Commit the weekly update
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json
          git diff --cached --quiet || git commit -m "Update weekly Stack Review"
          git pull --rebase origin main
          git push
